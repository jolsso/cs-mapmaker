services:
  forge:
    build:
      context: .
      dockerfile: docker/forge/Dockerfile
    image: mapforge/forge:dev
    init: true
    working_dir: /work
    volumes:
      - .:/work
      # Local Half-Life install (official maps + WADs), read-only. Set HL_DIR in .env
      # (see .env.example); without it an empty placeholder dir is mounted.
      - ${HL_DIR:-./build/no-hl-install}:/refmaps/hl:ro
      # `simulate` starts the HLDS server containers through the host's Docker (Docker SDK).
      - /var/run/docker.sock:/var/run/docker.sock

  # Local website (build/site/, rebuilt by the pipeline): `docker compose up -d site`,
  # then http://localhost:8080. Bound to 127.0.0.1 only: nothing leaves this machine.
  site:
    image: mapforge/forge:dev
    working_dir: /work
    volumes:
      - .:/work:ro
    ports:
      - "127.0.0.1:8080:8080"
    command: ["python", "-m", "http.server", "8080", "--directory", "/work/build/site"]
    restart: unless-stopped

  # Live collector for running simulations: the tracker plugins send UDP datagrams over the
  # mapforge-sim network; browsers get a Server-Sent Events stream on http://localhost:8090.
  # `docker compose up -d live` (the dashboard's Live page uses it). 127.0.0.1 only.
  live:
    image: mapforge/forge:dev
    container_name: mapforge-live
    working_dir: /work
    volumes:
      - .:/work:ro
    ports:
      - "127.0.0.1:8090:8090"
    networks: [default, sim]
    command: ["python", "-m", "mapforge.live.collector"]
    restart: unless-stopped

networks:
  sim:
    name: mapforge-sim
