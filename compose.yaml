services:
  forge:
    build:
      context: .
      dockerfile: docker/forge/Dockerfile
    image: mapforge/forge:dev
    init: true
    working_dir: /work
    volumes:
      - .:/work
      # Local Half-Life install (official maps + WADs), read-only. Set HL_DIR in .env
      # (see .env.example); without it an empty placeholder dir is mounted.
      - ${HL_DIR:-./build/no-hl-install}:/refmaps/hl:ro
