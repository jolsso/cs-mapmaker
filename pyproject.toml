[project]
name = "mapforge"
version = "0.1.0"
description = "Automated design/compile/test pipeline for Counter-Strike 1.6 (GoldSrc) maps"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "go-task-bin>=3.44",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs fetched compilers (run `uv run task tools:fetch`)"]
