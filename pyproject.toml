[project]
name = "mapforge"
version = "0.1.0"
description = "Automated design/compile/test pipeline for Counter-Strike 1.6 (GoldSrc) maps"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1",
    "moderngl>=5.11",
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "go-task-bin>=3.44",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Not installed as a package: modules run from the repo root with `python -m mapforge.…`,
# so the container never needs to build/install the project at runtime.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# HTML templates: long string literals read better unbroken
"mapforge/site/build.py" = ["E501"]
"mapforge/site/charts.py" = ["E501"]
"mapforge/analyze/run.py" = ["E501"]
"mapforge/loop/run.py" = ["E501"]
"mapforge/live/collector.py" = ["E501"]
"mapforge/annotations.py" = ["E501"]
"mapforge/decide/policy.py" = ["E501"]
"mapforge/decide/run.py" = ["E501"]
# fixture rows read better one per line
"tests/test_analyze.py" = ["E501"]
"tests/test_loop.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs fetched compilers (run `uv run task tools:fetch`)"]
