  - {name: d_t_mid, between: [t_spawn, mid_s], width: 192}
  - {name: d_mid_s, between: [mid_s, mid], width: 192, arch: true}
  - {name: d_mid_short, between: [mid, a_short], width: 192, arch: true}
  - {name: d_mid_n, between: [mid, mid_n], width: 160}
  - {name: d_short_up, between: [a_short, a_short_up], width: 192}
  - {name: d_short_top, between: [a_short_up, a_short_top], width: 192}
  - {name: d_short_choke, between: [a_short_top, a_site], width: 160, protected: true}   # chokepoint A short
  - {name: w_short_ramp, between: [a_short_up, a_ramp], width: 96, kind: window, sill: 96, height: 64, glass: true}
  - {name: d_ct_a, between: [ct_spawn, ct_to_a], width: 192}
  - {name: d_cta_site, between: [ct_to_a, a_site], width: 192}
  - {name: d_t_b, between: [t_spawn, t_to_b], width: 192}
  - {name: d_b_diag_in, between: [t_to_b, b_diag], width: 160, offset: -16}
  - {name: d_b_tunnel_in, between: [b_diag, b_tunnel], width: 160, offset: -16}
  - {name: d_b_choke, between: [b_tunnel, b_site], width: 160, protected: true}   # chokepoint B tunnel
  - {name: d_mid_n_b, between: [mid_n, b_short], width: 160}
  - {name: d_b_short_site, between: [b_short, b_site], width: 160, gate: rotating}
  - {name: d_ct_b, between: [ct_spawn, ct_to_b], width: 192}
  - {name: d_ctb_site, between: [ct_to_b, b_site], width: 192}

ramps:
