# de_cistern02 – engine test map for generator package 3 (2026-10-15): de_cistern01 plus a
# lift with buttons from B up to the office (beside the ladder hatch), arched doorways,
# faceted round pillars and the crate_stack / barrels / pallets cover presets.
name: de_cistern02
grid: 16
wall: 16
sounds: true

concept: "Cisternen: B er en oversvømmet underjordisk hal med et kontor ovenpå, A er en solbagt gård; tre ruter ned i dybet"
archetype: asymmetric
landmarks:
  - {name: Søjlehallen, element: b_pillar_w, zone: b_site, function: "runde søjler i vandet; callout"}
  - {name: Kontoret, element: h_office, zone: b_upper, function: "kontor over B, nås ad stigen gennem lemmen eller med elevatoren"}
  - {name: Glasvinduet, element: w_short_ramp, zone: a_short_up, function: "info fra short ind på A-rampen"}
chokes:
  - {name: Long-porten, door: d_long_choke, type: doorway, engagement: long, utility: smoke}
  - {name: Short-trappen, door: d_short_choke, type: doorway, engagement: close, utility: flash}
  - {name: Tunnel-mundingen, door: d_b_choke, type: doorway, engagement: close, utility: molotov}
irregularities:
  - {element: b_diag, purpose: "skrå korridor (diagonal-makro) skjuler tunnelen fra T-siden"}
  - {element: b_tunnel_down, purpose: "rampen ned i cisternen: højdeforskel giver forsvaret overblik"}
intended_strategies:
  T: ["rush B ned gennem tunnelen", "mid → short A via glasvinduet", "mid → B ned ad b_short"]
  CT: ["2-1-2 (A-rampen, mid_n, kontoret over B)", "stack A, retake B ned ad ct_to_b"]

zones:
  t: {floor: DEV_FLOOR_RED, wall: DEV_WALL_RED, ceiling: DEV_CEIL_RED, light: {color: [255, 214, 190]}}
  mid: {floor: DEV_FLOOR_GREY, wall: DEV_WALL_GREY, ceiling: DEV_CEIL_GREY, cover: DEV_METAL}
  a: {floor: DEV_FLOOR_SAND, wall: DEV_WALL_SAND, ceiling: DEV_CEIL_SAND}
  b: {floor: DEV_FLOOR_BLUE, wall: DEV_CONCRETE, ceiling: DEV_CEIL_BLUE, cover: DEV_CONCRETE, light: {color: [200, 220, 
            255], brightness: 200}}
  ct: {floor: DEV_FLOOR_GREEN, wall: DEV_WALL_GREEN, ceiling: DEV_CEIL_GREEN}

sky:
  name: desert
  sun: {pitch: -55, yaw: 120, color: [255, 238, 210], brightness: 300, ambient: 100}

areas:
  # T side (south)
