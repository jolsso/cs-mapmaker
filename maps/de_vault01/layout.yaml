wedges:
  - {name: b_diag_ne, area: b_diag, corner: ne, size: [432, 432]}   # with b_diag_sw: a 45° corridor
  - {name: b_diag_sw, area: b_diag, corner: sw, size: [432, 432]}
  - {name: mid_nw, area: mid, corner: nw, size: [192, 192]}
  - {name: mid_sw, area: mid, corner: sw, size: [192, 192]}
  - {name: a_long_se, area: a_long, corner: se, size: [128, 128]}

cover:
