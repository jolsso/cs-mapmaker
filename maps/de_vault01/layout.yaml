  - {name: mid_crate, area: mid, pos: [320, -768], size: [64, 64, 64]}
  - {name: a_long_crate, area: a_long, pos: [1648, -1200], size: [64, 128, 64]}
  - {name: a_ramp_crate, area: a_ramp, pos: [1600, 352], size: [96, 96, 64]}
  - {name: a_site_box, area: a_site, pos: [1984, 1600], size: [96, 96, 64]}
  - {name: a_site_box_top, area: a_site, pos: [1984, 1600], size: [48, 48, 48], z: 64}   # boost spot
  - {name: a_site_crate, area: a_site, pos: [1760, 1280], size: [64, 64, 64]}
  - {name: a_short_crate, area: a_short_up, pos: [1168, 400], size: [64, 64, 64]}
  - {name: b_tunnel_crate, area: b_tunnel, pos: [-1952, -600], size: [64, 64, 64]}
  - {name: b_catwalk, area: b_site, pos: [-1984, 1792], size: [896, 128, 16], z: 176}
  - {name: b_pillar_w, area: b_site, pos: [-2176, 1104], size: [64, 64, 384]}
  - {name: b_pillar_e, area: b_site, pos: [-1792, 1104], size: [64, 64, 384]}
  - {name: b_crate, area: b_site, pos: [-1984, 1360], size: [96, 96, 64]}
  - {name: ct_crate, area: ct_spawn, pos: [512, 1904], size: [64, 64, 64]}
  # screens at the nook mouths (a 64-wide way in at one end)
  - {name: b_tunnel_nook_screen, area: b_tunnel_nook, pos: [-2024, -688], size: [16, 224, 128]}
  - {name: mid_s_nook_screen, area: mid_s_nook, pos: [200, -1488], size: [16, 224, 128]}
  - {name: a_short_nook_screen, area: a_short_nook, pos: [928, -712], size: [192, 16, 128]}
  - {name: ct_to_b_nook_screen, area: ct_to_b_nook, pos: [-1136, 1864], size: [192, 16, 128]}
  - {name: t_to_b_nook_screen, area: t_to_b_nook, pos: [-1008, -2408], size: [192, 16, 128]}
