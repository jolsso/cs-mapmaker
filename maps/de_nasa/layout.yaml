# de_nasa – first blockout from the confirmed intent (maps/de_nasa/intent.json, 2026-10-16).
# A rocket launch site: T must destroy the new spy satellite (A: on the launch pad, B: in the lab).
#
#  b_control(+128)═ct_to_b══════ CT spawn ═ct_to_a═ A: launch pad (tower + rocket)
#     │ window/balcony                               │      │
#   B: lab ═b_doors          a_short═╗           long_n    │
#     │         │                    ║                │      │
#  b_tunnel_n  mid_to_b          a_short_up      long_mid (pit)
#     │         │                    ║                │
#  b_tunnels_mid ═ hangar ═ MID yard ═╝             long_s
#     │                      │                         │
#  b_tunnel                mid_s                  a_long_start
#     │                      │                         │
#  b_tunnels_s ═ t_to_b ═ T spawn ═ t_to_long ═════════╝
#
# Design (DESIGN_GUIDE.md):
#  - 3 T lanes like dust2: long -> A, mid -> short A or mid -> hangar -> B doors, tunnels -> B.
#    One chokepoint before each site entrance: long doors, short A, B doors, tunnel mouth.
#  - Mid is the decision: from the yard T go north-east (short A) or west through the hangar
#    (B doors, or back into the tunnels). Long has no connector (like dust2). No 4-way junctions.
#  - CT spawn north, near A (~3 s); the long way to B goes up into the control centre, which
#    overlooks the lab through a window and drops onto a balcony.
#  - Tower: only the lowest deck (128) is climbable (no_go: rocket and upper tower out of reach).

name: de_nasa
grid: 16
wall: 16
sky:
  name: grnplsnt    # clear blue sky with a sun (sunny coastal launch site)
  sun: {pitch: -45, yaw: 135, color: [255, 244, 225], brightness: 300, ambient: 100}
lights: {spacing: 320, brightness: 230, color: [240, 244, 255]}

concept: "Stop the launch: hit the rocket on the open launch pad (A) or the satellite in the clean-room lab (B); whoever holds
  the mid yard between the hangars picks the site."
archetype: three_lane
landmarks:
  - {name: The tower, element: a_tower, zone: a_site, function: "lattice launch tower; its deck (128) is A's high spot; callout"}
  - {name: The rocket, element: a_rocket, zone: a_site, function: "unreachable rocket beside the tower; seen from far away,
      the map's orientation point"}
  - {name: The satellite, element: b_sat, zone: b_site, function: "the spy satellite on its stand in the lab; B's central
      cover and callout"}
  - {name: Control, element: b_balcony, zone: b_site, function: "the control centre's balcony over the lab; CT's high spot
      on B"}
  - {name: The stage, element: mid_stage, zone: hangar, function: "a rocket stage on its transporter in the hangar; cover
      and callout"}
chokes:
  - {name: Long doors, door: d_long_doors, type: doorway, engagement: long, utility: smoke}
  - {name: Short, door: d_short_a, type: doorway, engagement: mid, utility: flash}
  - {name: B doors, door: d_b_doors, type: doorway, engagement: mid, utility: smoke}
  - {name: Tunnel mouth, door: d_tun_mouth, type: doorway, engagement: close, utility: flash}
irregularities:
  - {element: b_balcony, purpose: "raised balcony under the control door gives CT height over the satellite"}
  - {element: a_tower, purpose: "the tower deck gives A a high defensive spot over the long doors"}
intended_strategies:
  T: ["rush B through the tunnels", "take mid, split short A + long", "mid -> hangar -> B doors with a tunnel fake", "long
        A with smokes on the tower"]
  CT: ["2-1-2 (A, mid/short, B)", "stack A with a tower player, retake B through control", "AWP long, rotate through CT spawn"]

# Art pass (phase 7, 2026-10-18): a sunny coastal launch site (maps/de_nasa/ART_DIRECTION.md).
# Textures from the game's own WADs (cstrike/valve, referenced, never embedded); textures and
# light only, the layout is frozen since Gate B. Lessons from de_forge01: players (T tan/brown,
# CT dark blue) must stand out, so floors and walls are plain, light-to-mid grey, nothing tan or
# orange on T-facing surfaces, no busy or patterned textures on big faces, no metal floors.
#  - A (launch pad): light plain concrete pad, cool grey cast-concrete walls, cool grey crates,
#    the rocket white (HL rocket stage), warning stripes only on the blast wall.
#  - B (clean-room lab): white tile floor, white wall panels, a luminous white tile ceiling
#    (texlight) - bright and cool, the opposite of A's sun and concrete; lab racks and consoles
#    on the racks/console cover. bt: B's green-grey service corridors (doors, airlock).
#  - mid: grey concrete yard, big blue-grey steel-plate hangar walls, blue containers as cover.
#  - T: dark asphalt floor, plain cool grey concrete walls, grey steel panel cover; CT: grey
#    pavers, light cool wall panels, cool light. Corridor ceilings: plain grey concrete.
# Style review 2026-10-18 (FAILED, fixed): T cover TSHULL5 was tan/rust mottled (Ts blend in) ->
# plain grey STEEL; T tunnels dim -> light 320, spacing 256; A's vent-row concrete repeated and
# read taupe -> plain cool grey CONCRETE01 (no trim key in LAYOUT_SPEC; TK_CEILING tried, too mottled in the sun); sun 260 -> 300; tower
# read as concrete steps -> light steel GENERIC028, steps STEEL; mid's fine teal ribs shimmered ->
# calm teal-grey panels OUT_WALL3A; ct_to_b dark -> area light 320; bt ceiling -> lab tile.
# Style review round 2 (FAILED, fixed; picks by catalog mean rgb: b >= r, small spread, then
# checked plain on a sheet): T walls C_TNNL_CCRETE read khaki -> LAB1_W8A2 (131 137 139; C1A0_W2 tried, speckled); T cover
# STEEL was marbled -> LAB1_GDPNL5A panel (120 131 130); CT brick CORE_URBAN_136 warm taupe ->
# light cool panels C3A2A_W1 (155 162 166; GROUTTILES tried, two-tone checker); the copper coffered CRETE3_CEIL01 everywhere -> plain CORE_URBAN_023
# (117 117 118); mid OUT_WALL3A minty -> OUT_WALL7 teal-grey block (94 101 103); A floor
# CRETE4_FLR01 warm/mottled -> LAB1_W8A2; ct_to_b light cooler. b_control: no per-area
# texture key, its open end shares ct_to_b's faces (CT textures, now light grey).
# Style review round 3 (passed, findings fixed): T walls LAB1_W8A2 mottled granite -> plain
# CORE_URBAN_023 (117 117 118; BABTECH_BLOCK4 tried, streaky when tiled), T light less warm
# (250 245 235) so the walls stay grey; T cover/A steps LAB1_GDPNL5A mint+maroon -> grey sibling
# LAB1_GDPNL5 (136 138 144); mid's small brick OUT_WALL7 busy -> big blue-grey plates C3A1_W1
# (114 118 124; TNNL_W12D/D2 tried, rust flecks); A cover TSHULL7 beige -> cool grey crate
# OF_CRATE03A (147 155 156). Left: CONCRETE01's repeating crack (only sibling CONCRETE01-2 has
# graffiti), CT pavers CORE_URBAN_120 (no cool paver: GROUTTILES checker, the rest metal/dark).
# 1st render round: T walls CRETE3_WALL01 rendered pink-tan behind T -> C_TNNL_CCRETE; the rust
# truss ceiling (CSTRIKE_CE2XCNG) was orange in every corridor -> coffered concrete; the lab's
# purple diamond plate (stand, balcony steps) -> light grey steel like A and CT.
