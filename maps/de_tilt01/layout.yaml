# de_tilt01 – BEVIDST UBALANCERET testmap til fase 6 (ROADMAP: "Loopet forbedrer et bevidst
# ubalanceret map mod målintervallerne"). Kopi af de_forge01 v004, men CT's direkte vej til B
# (d_ct_b1: ct_spawn -> ct_to_b) er fjernet: CT skal rotere via A og mid_top for at nå B.
# Loopet ændrer denne fil; de_forge01 røres ikke.
#
# de_forge01 – generated blockout, revised after docs/DESIGN_GUIDE.md (iterations 4-6).
#
#   B site ═ct_to_b═══════ CT spawn ═ct_to_a═ A site (raised 32)
#     │  ╚b_short                    a_short╝   │
#     │      b_short_up        a_short_up       │
#  b_tunnel_n     ╚═══ mid_top (junction) ═══╝  long_ec_n
#     │                     │                   │
#  b_tunnels ═ mid_to_b ═══ MID ═══ mid_to_long ═ a_long
#     │                     │                   │
#  b_tunnel_s             mid_s              long_ec_s
#     │                     │                   │
#   b_start ═══ t_to_b ═ T spawn ═ t_to_long ═══ a_long_start
#
# Design (DESIGN_GUIDE.md):
#  - 3 main T paths (long -> A, tunnels -> B, mid -> short A / short B), one chokepoint each
#    before the site: long_ec_n door, b_tunnel_n door, a_short/b_short doors.
#  - Connecting paths (mid_to_long, mid_to_b, mid_top) join the main paths before the
#    chokepoints, never through them. Mid never leads into a spawn.
#  - Each site: entrances from long/tunnels (T), short (T + CT rotation) and CT's own corridor.
#  - CT spawn sits towards A: short way to A, long way to B.
#  - Zones 768x768 on columns x = -2048..-1280 | -384..384 | 1280..2048 (same rows in y);
#    connectors fill the 864-unit gaps, one 16-unit wall from their neighbours.

name: de_tilt01
grid: 16
wall: 16
sky:
  name: desert
  sun: {pitch: -55, yaw: 120, color: [255, 238, 210], brightness: 300, ambient: 110}
lights: {spacing: 320, brightness: 230, color: [255, 232, 200]}

areas:
  # --- spawns and sites ---
  - {name: t_spawn, rect: [-384, -2432, 384, -1664], height: 256, outdoor: true, role: t_spawn}   # pushed south: T -> site ~16-18 s
  - {name: ct_spawn, rect: [-128, 1440, 640, 2048], height: 256, outdoor: true, role: ct_spawn}
  - {name: a_site, rect: [1280, 1280, 2048, 2048], floor: 32, height: 320, outdoor: true, role: site}
  - {name: b_site, rect: [-2048, 1280, -1280, 2048], height: 224, role: site}
  - {name: mid, rect: [-384, -384, 384, 384], height: 288, outdoor: true, role: mid}
  # --- east: A long (long-range lane) ---
  - {name: a_long_start, rect: [1280, -2048, 2048, -1280], height: 288, outdoor: true, role: corridor}
  - {name: a_long, rect: [1280, -384, 2048, 384], height: 288, outdoor: true, role: corridor}
  - {name: long_ec_s, rect: [1472, -1264, 1856, -400], height: 288, outdoor: true, role: corridor}
  - {name: long_ec_n, rect: [1472, 400, 1856, 1264], height: 288, outdoor: true, role: corridor}
  # --- west: B tunnels (close quarters) ---
  - {name: b_start, rect: [-2048, -2048, -1280, -1280], height: 256, outdoor: true, role: corridor}
  - {name: b_tunnels, rect: [-2048, -384, -1280, 384], height: 160, role: corridor}
  - {name: b_tunnel_s, rect: [-1792, -1264, -1536, -400], height: 144, role: corridor}
  - {name: b_tunnel_n, rect: [-1792, 400, -1536, 1264], height: 144, role: corridor}
  # --- middle and cross connectors ---
  - {name: mid_s, rect: [-192, -1648, 192, -400], height: 256, outdoor: true, role: corridor}
  - {name: t_to_long, rect: [400, -1856, 1264, -1472], height: 192, role: corridor}
  - {name: t_to_b, rect: [-1264, -1856, -400, -1472], height: 192, role: corridor}
  - {name: mid_to_long, rect: [400, -128, 1264, 128], height: 160, role: corridor}
  - {name: mid_to_b, rect: [-1264, -128, -400, 128], height: 144, role: corridor}
  - {name: mid_top, rect: [-960, 400, 960, 912], height: 256, outdoor: true, role: mid}
  - {name: a_short_up, rect: [656, 928, 912, 1280], height: 192, role: corridor}
  - {name: a_short, rect: [656, 1296, 1264, 1504], height: 192, role: corridor}
  - {name: b_short_up, rect: [-912, 928, -656, 1280], height: 192, role: corridor}
  - {name: b_short, rect: [-1264, 1296, -656, 1504], height: 192, role: corridor}
  - {name: ct_to_a, rect: [656, 1600, 1264, 1856], height: 192, role: corridor}
  - {name: ct_to_b, rect: [-1264, 1600, -144, 1856], height: 192, role: corridor}

doors:
  # T side
  - {name: d_t_long, between: [t_spawn, t_to_long], width: 192}
  - {name: d_long_start, between: [t_to_long, a_long_start], width: 192}
  - {name: d_t_b, between: [t_spawn, t_to_b], width: 192}
  - {name: d_b_start, between: [t_to_b, b_start], width: 192}
  - {name: d_t_mid, between: [t_spawn, mid_s], width: 256}
  - {name: d_mid_s, between: [mid_s, mid], width: 256, offset: -64}
  - {name: d_long_s1, between: [a_long_start, long_ec_s], width: 192, offset: -96}
  - {name: d_long_s2, between: [long_ec_s, a_long], width: 192, offset: 96}
  - {name: d_long_n1, between: [a_long, long_ec_n], width: 192, offset: -96}
  - {name: d_long_n2, between: [long_ec_n, a_site], width: 192, offset: 96, protected: true}
  - {name: d_b_tun_s1, between: [b_start, b_tunnel_s], width: 160, offset: 32}
  - {name: d_b_tun_s2, between: [b_tunnel_s, b_tunnels], width: 160, offset: -32}
  - {name: d_b_tun_n1, between: [b_tunnels, b_tunnel_n], width: 160, offset: 32}
  - {name: d_b_tun_n2, between: [b_tunnel_n, b_site], width: 160, offset: -32, protected: true}
  - {name: d_mid_long1, between: [mid, mid_to_long], width: 160}
  - {name: d_mid_long2, between: [mid_to_long, a_long], width: 160}
  - {name: d_mid_b1, between: [mid, mid_to_b], width: 128}
  - {name: d_mid_b2, between: [mid_to_b, b_tunnels], width: 128}
  - {name: d_mid_top, between: [mid, mid_top], width: 192, offset: 160}
  - {name: d_top_ashort, between: [mid_top, a_short_up], width: 192}
  - {name: d_ashort_turn, between: [a_short_up, a_short], width: 192}
  - {name: d_ashort_a, between: [a_short, a_site], width: 160, protected: true}
  - {name: d_top_bshort, between: [mid_top, b_short_up], width: 192}
  - {name: d_bshort_turn, between: [b_short_up, b_short], width: 192}
  - {name: d_bshort_b, between: [b_short, b_site], width: 160, protected: true}
  - {name: d_ct_a1, between: [ct_spawn, ct_to_a], width: 192}
  - {name: d_ct_a2, between: [ct_to_a, a_site], width: 192}
  - {name: d_ct_b2, between: [ct_to_b, b_site], width: 192, offset: -32}
  - {name: d_ct_spawn_ct_to_b, between: [ct_spawn, ct_to_b], width: 128}
stairs:
  # A site is 32 higher: steps near the end of every approach (gives the defender height)
  - {name: a_steps_long, area: long_ec_n, axis: +y, rise: 32, step: 16, run: 32, start: 640}
  - {name: a_steps_short, area: a_short, axis: +x, rise: 32, step: 16, run: 32, start: 352}
  - {name: a_steps_ct, area: ct_to_a, axis: +x, rise: 32, step: 16, run: 32, start: 352}

cover:
  # A site: double stack, a short crate and a wall by the long entrance
  - {name: a_box_big, area: a_site, pos: [1552, 1680], size: [128, 128, 96]}
  - {name: a_box_small, area: a_site, pos: [1680, 1600], size: [64, 64, 48]}
  - {name: a_wall, area: a_site, pos: [1904, 1456], size: [32, 192, 96]}
  - {name: a_box_short, area: a_site, pos: [1424, 1488], size: [64, 64, 64]}
  # B site: two pillars and a crate cluster
  - {name: b_pillar_w, area: b_site, pos: [-1856, 1600], size: [64, 64, 224]}
  - {name: b_pillar_e, area: b_site, pos: [-1472, 1760], size: [64, 64, 224]}
  - {name: b_crates, area: b_site, pos: [-1664, 1920], size: [128, 64, 64]}
  # iteration 5: post-plant cover where T enters (tunnel/short) and a low platform between pillars
  - {name: b_platform, area: b_site, pos: [-1664, 1680], size: [192, 128, 32]}
  - {name: b_box_se, area: b_site, pos: [-1440, 1424], size: [64, 64, 64]}
  # iteration 6: screen wall inside B's CT door (review: CT spawn still saw onto B) and a crate
  # in mid_s (long open line from T spawn into mid)
  - {name: b_ct_screen, area: b_site, pos: [-1408, 1728], size: [32, 256, 128]}
  - {name: mid_s_box, area: mid_s, pos: [-64, -1024], size: [96, 64, 64]}
  # mid and the mid_top junction
  - {name: mid_box, area: mid, pos: [0, 0], size: [192, 96, 96]}
  - {name: top_box_w, area: mid_top, pos: [-512, 656], size: [96, 96, 64]}
  - {name: top_box_e, area: mid_top, pos: [448, 720], size: [96, 96, 64]}
  # long: cover along the lane
  - {name: long_box, area: a_long, pos: [1760, 0], size: [96, 96, 64]}
  - {name: long_start_box, area: a_long_start, pos: [1664, -1568], size: [128, 64, 64]}
  # B route
  - {name: b_tun_wall, area: b_tunnels, pos: [-1664, 0], size: [256, 32, 160]}
  - {name: b_tun_box, area: b_tunnels, pos: [-1472, 224], size: [64, 64, 64]}
  - {name: b_start_box, area: b_start, pos: [-1728, -1664], size: [128, 96, 64]}
  - {name: b_start_wall, area: b_start, pos: [-1440, -1440], size: [32, 192, 96]}

sites: {A: a_site, B: b_site}
spawns:
  T: {area: t_spawn, count: 16}
  CT: {area: ct_spawn, count: 16}
buyzones: true
