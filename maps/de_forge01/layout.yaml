# de_forge01 – generated blockout, revised after docs/DESIGN_GUIDE.md (iterations 4-6).
#
#   B site ═ct_to_b═══════ CT spawn ═ct_to_a═ A site (raised 32)
#     │  ╚b_short                    a_short╝   │
#     │      b_short_up        a_short_up       │
#  b_tunnel_n     ╚═══ mid_top (junction) ═══╝  long_ec_n
#     │                     │                   │
#  b_tunnels ═ mid_to_b ═══ MID ═══ mid_to_long ═ a_long
#     │                     │                   │
#  b_tunnel_s             mid_s              long_ec_s
#     │                     │                   │
#   b_start ═══ t_to_b ═ T spawn ═ t_to_long ═══ a_long_start
#
# Design (DESIGN_GUIDE.md):
#  - 3 main T paths (long -> A, tunnels -> B, mid -> short A / short B), one chokepoint each
#    before the site: long_ec_n door, b_tunnel_n door, a_short/b_short doors.
#  - Connecting paths (mid_to_long, mid_to_b, mid_top) join the main paths before the
#    chokepoints, never through them. Mid never leads into a spawn.
#  - Each site: entrances from long/tunnels (T), short (T + CT rotation) and CT's own corridor.
#  - CT spawn sits towards A: short way to A, long way to B.
#  - Zones 768x768 on columns x = -2048..-1280 | -384..384 | 1280..2048 (same rows in y);
#    connectors fill the 864-unit gaps, one 16-unit wall from their neighbours.

name: de_forge01
grid: 16
wall: 16
sky:
  name: desert
  sun: {pitch: -35, yaw: 225, color: [255, 220, 180], brightness: 220, ambient: 90}   # low afternoon sun (ART_DIRECTION §5)
lights: {spacing: 320, brightness: 230, color: [255, 232, 200]}

# Landmarks and chokepoints (ART_DIRECTION.md §2-3): callouts on existing cover and doors.
landmarks:
  - {name: Ovnvæggen, element: a_wall, zone: a_site, function: "glødende ovnvæg ved long-indgangen; callout"}
  - {name: Ingot-stablen, element: a_box_big, zone: a_site, function: "den store stak på A; callout og cover"}
  - {name: Transformatoren, element: mid_box, zone: mid, function: "midt på mid; callout"}
  - {name: Slaggevognen, element: long_box, zone: a_long, function: "midt på long; callout"}
  - {name: Kabelkanalen, element: b_tun_wall, zone: b_tunnels, function: "væggen i B-tunnellerne; callout"}
  - {name: Søjlerne, element: b_pillar_w, zone: b_site, function: "teal køletårnssøjler på B; callout"}
  - {name: Platformen, element: b_platform, zone: b_site, function: "lav pumpeplatform mellem søjlerne"}
chokes:
  - {name: Long-porten, door: d_long_n2, type: doorway, engagement: long, utility: smoke}
  - {name: Tunnel-mundingen, door: d_b_tun_n2, type: doorway, engagement: close, utility: flash}
  - {name: Short A, door: d_ashort_a, type: doorway, engagement: mid, utility: flash}
  - {name: Short B, door: d_bshort_b, type: doorway, engagement: mid, utility: smoke}

# Art pass (phase 7, 2026-10-15): industrial theme - a steel works being shut down
# (maps/de_forge01/ART_DIRECTION.md). Textures from the game's own WADs (cstrike.wad,
# referenced, never embedded). Textures and light only: the layout is frozen since Gate B.
zones:
  t: {floor: CSTRIKE_FT4APHT, wall: CSTRIKE_WB6PLN1, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_OE4PNL,
      light: {color: [255, 226, 170]}}
  ct: {floor: CSTRIKE_CR2PLN, wall: CSTRIKE_WR4CCPN, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_ME4METL,
       light: {color: [225, 235, 255]}}
  mid: {floor: CSTRIKE_FT2DIRT, wall: -0CSTRIKE_WR3CC, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_ME2RSTW}
  a: {floor: CSTRIKE_FE2SQRS, wall: CSTRIKE_ME2RSTW, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_ME2DRST,
      light: {color: [255, 190, 140], brightness: 240}}
  b: {floor: CSTRIKE_ME1GRAT, wall: -0CSTRIKE_WE1MT, ceiling: CSTRIKE_ME1CLNG, cover: CSTRIKE_OE4PNL,
      light: {color: [190, 225, 230], brightness: 220}}
texlights: {-0CSTRIKE_MH5TL: [255, 160, 90, 700]}   # the furnace wall at A (Ovnvæggen)

ambient:   # ART_DIRECTION §6 (sounds the game ships: valve/sound/ambience)
