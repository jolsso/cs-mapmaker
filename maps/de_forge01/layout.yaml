  - {name: b_pumps, area: b_site, sound: ambience/pumper.wav, volume: 6}
  - {name: b_drips, area: b_tunnels, sound: ambience/drips.wav, volume: 5, radius: small}
  - {name: mid_wind, area: mid, sound: ambience/wind1.wav, volume: 4}
  - {name: t_machines, area: t_spawn, sound: ambience/industrial3.wav, volume: 3}
  - {name: ct_machines, area: ct_spawn, sound: ambience/dronemachine1.wav, volume: 3}
areas:
