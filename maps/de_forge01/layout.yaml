# de_forge01 – generated blockout, revised after docs/DESIGN_GUIDE.md (iterations 4-6).
#
#   B site ═ct_to_b═══════ CT spawn ═ct_to_a═ A site (raised 32)
#     │  ╚b_short                    a_short╝   │
#     │      b_short_up        a_short_up       │
#  b_tunnel_n     ╚═══ mid_top (junction) ═══╝  long_ec_n
#     │                     │                   │
#  b_tunnels ═ mid_to_b ═══ MID ═══ mid_to_long ═ a_long
#     │                     │                   │
#  b_tunnel_s             mid_s              long_ec_s
#     │                     │                   │
#   b_start ═══ t_to_b ═ T spawn ═ t_to_long ═══ a_long_start
#
# Design (DESIGN_GUIDE.md):
#  - 3 main T paths (long -> A, tunnels -> B, mid -> short A / short B), one chokepoint each
#    before the site: long_ec_n door, b_tunnel_n door, a_short/b_short doors.
#  - Connecting paths (mid_to_long, mid_to_b, mid_top) join the main paths before the
#    chokepoints, never through them. Mid never leads into a spawn.
#  - Each site: entrances from long/tunnels (T), short (T + CT rotation) and CT's own corridor.
#  - CT spawn sits towards A: short way to A, long way to B.
#  - Zones 768x768 on columns x = -2048..-1280 | -384..384 | 1280..2048 (same rows in y);
#    connectors fill the 864-unit gaps, one 16-unit wall from their neighbours.

name: de_forge01
grid: 16
wall: 16
sky:
  name: grnplsnt    # an ordinary blue sky with a visible sun (in-game feedback: desert and TrainYard looked wrong)
  sun: {pitch: -30, yaw: 90, color: [255, 236, 210], brightness: 220, ambient: 90}   # light from the sun in the skybox's back side (check in game)
lights: {spacing: 320, brightness: 230, color: [255, 232, 200]}

