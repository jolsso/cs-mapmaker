  - {name: t_spawn, rect: [-384, -2432, 384, -1664], height: 256, outdoor: true, role: t_spawn, zone: t}   # pushed south: T -> site ~16-18 s
  - {name: ct_spawn, rect: [-128, 1440, 640, 2048], height: 256, outdoor: true, role: ct_spawn, zone: ct}
  - {name: a_site, rect: [1280, 1280, 2048, 2048], floor: 32, height: 320, outdoor: true, role: site, zone: a}
  - {name: b_site, rect: [-2048, 1280, -1280, 2048], height: 224, role: site, zone: b}
  - {name: mid, rect: [-384, -384, 384, 384], height: 288, outdoor: true, role: mid, zone: mid}
  # --- east: A long (long-range lane) ---
  - {name: a_long_start, rect: [1280, -2048, 2048, -1280], height: 288, outdoor: true, role: corridor, zone: a}
  - {name: a_long, rect: [1280, -384, 2048, 384], height: 288, outdoor: true, role: corridor, zone: a}
  - {name: long_ec_s, rect: [1472, -1264, 1856, -400], height: 288, outdoor: true, role: corridor, zone: a}
  - {name: long_ec_n, rect: [1472, 400, 1856, 1264], height: 288, outdoor: true, role: corridor, zone: a}
  - {name: b_tunnels, rect: [-2048, -384, -1280, 384], height: 160, role: corridor, zone: b}
  - {name: b_tunnel_n, rect: [-1792, 400, -1536, 1264], height: 144, role: corridor, zone: b}
  # --- middle and cross connectors ---
  - {name: mid_s, rect: [-192, -1648, 192, -400], height: 256, outdoor: true, role: corridor, zone: mid}
  - {name: t_to_long, rect: [400, -1856, 1264, -1472], height: 192, role: corridor, zone: t}
  - {name: t_to_b, rect: [-1264, -1856, -400, -1472], height: 192, role: corridor, zone: t}
  - {name: mid_to_long, rect: [400, -128, 1264, 128], height: 160, role: corridor, zone: mid}
  - {name: mid_to_b, rect: [-1264, -128, -400, 128], height: 144, role: corridor, zone: mid}
  - {name: mid_top, rect: [-960, 400, 960, 912], height: 256, outdoor: true, role: mid, zone: mid}
  - {name: a_short_up, rect: [656, 928, 912, 1280], height: 192, role: corridor, zone: a}
  - {name: a_short, rect: [656, 1296, 1264, 1504], height: 192, role: corridor, zone: a}
  - {name: b_short_up, rect: [-912, 928, -656, 1280], height: 192, role: corridor, zone: b}
  - {name: b_short, rect: [-1264, 1296, -656, 1504], height: 192, role: corridor, zone: b}
  - {name: ct_to_a, rect: [656, 1600, 1264, 1856], height: 192, role: corridor, zone: ct}
  - {name: ct_to_b, rect: [-1264, 1600, -144, 1856], height: 192, role: corridor, zone: ct}
  - {name: t_b_cut, rect: [-1264, -1456, -1008, -144], height: 144, role: corridor, zone: t}

doors:
  # T side
  - {name: d_t_long, between: [t_spawn, t_to_long], width: 192}
  - {name: d_long_start, between: [t_to_long, a_long_start], width: 192}
  - {name: d_t_b, between: [t_spawn, t_to_b], width: 192}
  - {name: d_t_mid, between: [t_spawn, mid_s], width: 256}
  - {name: d_mid_s, between: [mid_s, mid], width: 256, offset: -64}
  # A long: staggered doors, so long is a sniper lane but not one straight line onto A
  - {name: d_long_s1, between: [a_long_start, long_ec_s], width: 192, offset: -96}
  - {name: d_long_s2, between: [long_ec_s, a_long], width: 192, offset: 96}
  - {name: d_long_n1, between: [a_long, long_ec_n], width: 192, offset: -96}
  - {name: d_long_n2, between: [long_ec_n, a_site], width: 192, offset: 96, protected: true} # chokepoint A long
  # B tunnels
  - {name: d_b_tun_n1, between: [b_tunnels, b_tunnel_n], width: 160, offset: 32}
  - {name: d_b_tun_n2, between: [b_tunnel_n, b_site], width: 160, offset: -32, protected: true} # chokepoint B tunnels
  # mid and its connections
  - {name: d_mid_long1, between: [mid, mid_to_long], width: 160}
  - {name: d_mid_long2, between: [mid_to_long, a_long], width: 160}
  - {name: d_mid_b1, between: [mid, mid_to_b], width: 128}
  - {name: d_mid_b2, between: [mid_to_b, b_tunnels], width: 128}
  - {name: d_mid_top, between: [mid, mid_top], width: 192, offset: 160}
  - {name: d_top_ashort, between: [mid_top, a_short_up], width: 192}
  - {name: d_ashort_turn, between: [a_short_up, a_short], width: 192}
  - {name: d_ashort_a, between: [a_short, a_site], width: 160, protected: true}          # chokepoint short A
  - {name: d_top_bshort, between: [mid_top, b_short_up], width: 192}
  - {name: d_bshort_turn, between: [b_short_up, b_short], width: 192}
  - {name: d_bshort_b, between: [b_short, b_site], width: 160, protected: true}          # chokepoint short B
  # CT side
  - {name: d_ct_a1, between: [ct_spawn, ct_to_a], width: 192}
  - {name: d_ct_a2, between: [ct_to_a, a_site], width: 192}
  - {name: d_ct_b1, between: [ct_spawn, ct_to_b], width: 192, offset: 32}              # staggered (iteration 5): no straight
  - {name: d_ct_b2, between: [ct_to_b, b_site], width: 192, offset: -32}               # 1100-unit line from CT spawn onto B

  - {name: d_t_b_cut_t_to_b, between: [t_b_cut, t_to_b], width: 160}
  - {name: d_t_b_cut_b_tunnels, between: [t_b_cut, b_tunnels], width: 160}
stairs:
