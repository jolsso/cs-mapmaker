  - {name: top_box_e, area: mid_top, pos: [448, 720], size: [96, 96, 64]}
  # long: cover along the lane
  - {name: long_box, area: a_long, pos: [1760, 0], size: [96, 96, 64], texture: CSTRIKE_ME4GREB}
  - {name: long_start_box, area: a_long_start, pos: [1664, -1568], size: [128, 64, 64]}
  # B route
  - {name: b_tun_wall, area: b_tunnels, pos: [-1664, 0], size: [256, 32, 160], texture: CSTRIKE_OE6TNKF}
  - {name: b_tun_box, area: b_tunnels, pos: [-1472, 224], size: [64, 64, 64]}
  - {name: b_cut_chicane, area: t_b_cut, pos: [-1184, -800], size: [160, 32, 128]}
  - {name: mid_top_cover, area: mid_top, pos: [-824, 704], size: [272, 32, 128]}
  - {name: mid_top_cover_2, area: mid_top, pos: [-576, 560], size: [32, 320, 128]}
  - {name: a_long_start_cover, area: a_long_start, pos: [1912, -1712], size: [272, 32, 128]}
  - {name: a_long_start_cover_2, area: a_long_start, pos: [1664, -1872], size: [32, 352, 128]}
  - {name: a_long_cover, area: a_long, pos: [1640, -264], size: [208, 32, 96]}

sites: {A: a_site, B: b_site}
spawns:
  T: {area: t_spawn, count: 16}
  CT: {area: ct_spawn, count: 16}
buyzones: true
