      light: {color: [255, 226, 170], brightness: 280}}   # style review: T->B tunnels were dim and brown
  ct: {floor: CONCRETE01, wall: OUT_WALL7B, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_OE4PNL,
       light: {color: [225, 235, 255]}}
  mid: {floor: CONCRETE01, wall: IKCONCC, ceiling: CSTRIKE_CE2XCNG, cover: CSTRIKE_ME2RSTW}
  a: {floor: CONCRETE02, wall: TSHULL1, ceiling: CSTRIKE_CE2XCNG, cover: TSHULL5,
      light: {color: [255, 190, 140], brightness: 240}}
  b: {floor: CONCRETE02, wall: CSTRIKE_OE4PNL, ceiling: CSTRIKE_ME1CLNG, cover: CSTRIKE_ME4METL,
      light: {color: [190, 225, 230], brightness: 220}}
  bt: {floor: CSTRIKE_ME1GRAT, wall: CSTRIKE_OE4PNL, ceiling: CSTRIKE_ME1CLNG, cover: CSTRIKE_ME4METL,
      light: {color: [190, 225, 230], brightness: 220}}
texlights: {-0CSTRIKE_MH5TL: [255, 160, 90, 700]}   # the furnace wall at A (Ovnvæggen)
# style review 2026-10-15 (local model + Claude): A was rust floor on rust walls (players blend in)
# -> grey steel floor; B's teal rust walls repeated and hid the teal pillars -> blue-grey walls.
# 2nd round: CT and mid floors were orange-brown like T clothing -> grey concrete / light gravel;
# 3rd round (full review after the play test): mid and CT shared one brick-patch wall that tiled
# like wallpaper -> plain concrete in mid, blue-grey block in CT; T floor sandy dirt -> asphalt.
# B tunnels grey on grey -> lighter metal panel walls.
# 3rd round: T corridors' dark red brick hid T players -> grey breeze block (cs_bdog.wad).
# 4th round: mid's light gravel was still tan -> grey concrete; door lights on the four chokes.
# 5th round: rust walls on A matched T clothing -> grey steel plates; warmth from the orange
# light and the furnace wall, rust stays on the ingot stack.
# In-game feedback 2026-10-15: metal floors everywhere were loud and tiring -> concrete,
# grating only in the B tunnels (zone bt).
# 6th round: CT's floor was a tan pattern and its walls had a purple trim -> blue-grey steel
# floor, plain grey concrete walls.

