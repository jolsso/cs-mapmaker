# Bot-data targets (>= 100 rounds per measurement). Changed 2026-10-10 after the design
# research (docs/DESIGN_GUIDE.md §9): YaPB cannot see a map, so bot numbers are sanity checks and
# bug finders, not the balance verdict (that is the human playtest at Gate C). The structural
# design norms are hard validator rules (config/pipeline.yaml -> validate).
targets:
  t_winrate: [0.35, 0.65]        # sanity band; real balance: Gate C
  site_split_a: [0.35, 0.65]     # share of plants on site A: both sites must be used
  max_kill_cell_share: [0, 0.10] # death-trap detector
  round_length_median_s: [50, 100]
# Reported (metrics.json, website), never scored: they mostly reflect YaPB's waypoint graph.
diagnostics:
  first_contact_s: [15, 25]      # replaced by per-choke arrival timing in validate
  dead_zone_share: [0, 0.20]     # dust2 has 16 %; low-traffic rooms can be valuable threats
min_rounds: 100

# Weighted distance to the target ranges (0 = all targets met).
weights:
  t_winrate: 0.35
  site_split_a: 0.25
  max_kill_cell_share: 0.2
  round_length_median_s: 0.2

# Each validator warning (structural design rules, timings) adds this to the loop's score, and
# "targets met" needs zero warnings: the loop optimises structure, not only bot numbers.
design_warning_penalty: 0.15

budget:
  max_iterations: 20
  max_wall_clock_h: 12           # hours of the loop's own run time (waiting for an answer or a cut-off does not count)
stop:
  targets_met_in_a_row: 2
  plateau_iterations: 5
  hard_fail_in_a_row: 3
  review_fail_in_a_row: 5

# The loop's toolbox (FITNESS.md -> "Tilladte ændringer"). A plan may only use these types.
# `params` lists required parameters; limits are checked by mapforge.decide.policy.
allowed_changes:
  move_corridor:
    description: Move a corridor/segment sideways or along its axis
    params: [target, delta]          # delta [dx, dy] units
    max_abs_delta: 256
  resize_corridor:
    description: Lengthen or shorten a corridor
    params: [target, length_delta]   # units, + longer / - shorter
    max_abs_delta: 256
  add_cover:
    description: Add a box/wall as cover inside a zone; with z a platform, bridge or a crate stacked on another (boost spot)
    params: [zone, position, size]   # position [x, y], size [w, d, h]; optional z (bottom above the floor), texture, shape (box|octagon|cylinder), breakable (wood|metal|glass|concrete), preset (crate_stack 128x64x128 boost spot | barrels 96x96x48 | pallets 64x64x16 step; size optional with a preset)
  remove_cover:
    description: Remove a piece of cover
    params: [target]
  adjust_opening:
    description: Change the width (or height) of a doorway/opening
    params: [target, width]
    min_width: 64                    # CLAUDE.md corridor/door norm
  move_spawn:
    description: Move spawns within their spawn zone
    params: [team, delta]
    max_abs_delta: 256
  add_connection:
    description: Add a secondary connection between two areas (kind door, or vent = crouch route, height 40-64)
    params: [from, to]               # optional width, offset, kind, height, arch (plain door)
    before_gate_b_only: true
    max_per_iteration: 1
  remove_connection:
    description: Remove a secondary connection
    params: [from, to]
    before_gate_b_only: true
    max_per_iteration: 1
  add_area:
    description: Add an area (corridor/room) one wall from its neighbours, with doors to them
    params: [name, rect, doors]      # rect [x0,y0,x1,y1] on the grid; doors [{to, width, offset?}]
    before_gate_b_only: true
    requires_annotation: true        # only when a human annotation asks for it
  remove_area:
    description: Remove an area (corridor/room) and its doors/cover/stairs; the space becomes solid
    params: [target]
    before_gate_b_only: true
    requires_annotation: true        # only when a human annotation asks for it
  add_window:
    description: A window between two areas one wall apart (sightline/info, not a route); optional breakable glass
    params: [from, to, width, sill]  # sill >= 64 above the higher floor; optional height, offset, glass
    max_per_iteration: 1
  set_gate:
    description: Put an openable door leaf in an opening (sliding / rotating) or take it out (none)
    params: [target, gate]
  set_arch:
    description: Round the top corners of a plain doorway (arch; the full width stays >= 80 high) or square it again (arch false)
    params: [target]                 # optional arch (default true)
  add_ramp:
    description: A sloped floor (<= 45 degrees) across an area; the rest of the area is raised (not in spawn areas)
    params: [zone, axis, rise, length] # axis +x/-x/+y/-y = uphill; optional start
  add_wedge:
    description: An angled wall cutting a corner of an area (triangular solid; two opposite ones = diagonal corridor)
    params: [zone, corner, size]     # corner ne/nw/se/sw, size [dx, dy] legs (equal = 45 degrees)
  add_ladder:
    description: A ladder against a wall of an area up to a platform or upper level
    params: [zone, wall, height]     # wall +x/-x/+y/-y; optional pos (along the wall)
    before_gate_b_only: true
  set_breakable:
    description: Make a piece of cover breakable (wood/metal/glass/concrete) or solid again (none)
    params: [target, material]
  add_hatch:
    description: A hole between an area and the one stacked above it, optionally with a ladder (stacked levels)
    params: [lower, upper, rect]     # rect [x0,y0,x1,y1] inside both; optional ladder +x/-x/+y/-y
    before_gate_b_only: true
    max_per_iteration: 1
  add_water:
    description: Water from the floor up `depth` in an area (shallow = wading, slows; deep = swimming)
    params: [zone, depth]            # optional rect
    before_gate_b_only: true
  bend_corridor:
    description: Bend an angled corridor (corridors:) through one or more points, each becoming a small knee room; breaks a long straight sightline. via [] straightens it again
    params: [target, via]            # via [[x, y], ...] on the grid; the end doors keep their names
    before_gate_b_only: true
    max_per_iteration: 1
  add_bridge:
    description: A walkable deck with railings across a tall area, wall to wall (one level crossing over another)
    params: [zone, axis, z]          # axis x/y = the way it runs; z = deck top above the floor (>= 80 + 16 under it, >= 80 over it); optional width (96), pos, rail (40, 0 = none)
    before_gate_b_only: true
    max_per_iteration: 1
  remove_element:
    description: Remove a ramp, angled wall, ladder, cover, stairs, hatch, water, bridge or window by name
    params: [target]
  lighting:
    description: Light intensity, colour or position
    params: [target]
    from_phase: 7
