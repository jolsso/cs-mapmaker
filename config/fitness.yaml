# Machine-readable mirror of docs/FITNESS.md. If the two disagree, FITNESS.md is wrong or this
# file is: fix both. The loop optimises only what is here.

# Locked decisions: never changed by the loop without human approval (filled at Gate A / B).
# Gate A approved 2026-10-10 for de_forge01 (layout v004, history/de_forge01/004).
locked:
  theme: ""              # not chosen yet: decided before the art pass (phase 7)
  map_type: "de"
  topology: "3x3 zones; three T routes (long -> A, tunnels -> B, mid -> mid_top -> short A / short B), one chokepoint each before the site; CT spawn north, towards A"
  site_locations:
    - "A: north-east zone (x 1280..2048, y 1280..2048), raised 32"
    - "B: north-west zone (x -2048..-1280, y 1280..2048), indoor"
  landmarks: []          # none yet (graybox); named at the art pass
  geometry_frozen: false # true after Gate B

# Bot-data targets (>= 100 rounds per measurement). Changed 2026-10-10 after the design
# research (docs/DESIGN_GUIDE.md §8): YaPB cannot see a map, so bot numbers are sanity checks and
# bug finders, not the balance verdict (that is the human playtest at Gate C). The structural
# design norms are hard validator rules (config/pipeline.yaml -> validate).
targets:
  t_winrate: [0.35, 0.65]        # sanity band; real balance: Gate C
  site_split_a: [0.35, 0.65]     # share of plants on site A: both sites must be used
  max_kill_cell_share: [0, 0.10] # death-trap detector
  round_length_median_s: [50, 100]
# Reported (metrics.json, website), never scored: they mostly reflect YaPB's waypoint graph.
diagnostics:
  first_contact_s: [15, 25]      # replaced by per-choke arrival timing in validate
  dead_zone_share: [0, 0.20]     # dust2 has 16 %; low-traffic rooms can be valuable threats
min_rounds: 100

# Weighted distance to the target ranges (0 = all targets met).
weights:
  t_winrate: 0.35
  site_split_a: 0.25
  max_kill_cell_share: 0.2
  round_length_median_s: 0.2

budget:
  max_iterations: 20
  max_wall_clock_h: 12
stop:
  targets_met_in_a_row: 2
  plateau_iterations: 5
  hard_fail_in_a_row: 3
  review_fail_in_a_row: 5

# The loop's toolbox (FITNESS.md -> "Tilladte ændringer"). A plan may only use these types.
# `params` lists required parameters; limits are checked by mapforge.decide.policy.
allowed_changes:
  move_corridor:
    description: Move a corridor/segment sideways or along its axis
    params: [target, delta]          # delta [dx, dy] units
    max_abs_delta: 256
  resize_corridor:
    description: Lengthen or shorten a corridor
    params: [target, length_delta]   # units, + longer / - shorter
    max_abs_delta: 256
  add_cover:
    description: Add a box/wall as cover inside a zone
    params: [zone, position, size]   # position [x, y], size [w, d, h]
  remove_cover:
    description: Remove a piece of cover
    params: [target]
  adjust_opening:
    description: Change the width (or height) of a doorway/opening
    params: [target, width]
    min_width: 64                    # CLAUDE.md corridor/door norm
  move_spawn:
    description: Move spawns within their spawn zone
    params: [team, delta]
    max_abs_delta: 256
  add_connection:
    description: Add a secondary connection between two areas
    params: [from, to]
    before_gate_b_only: true
    max_per_iteration: 1
  remove_connection:
    description: Remove a secondary connection
    params: [from, to]
    before_gate_b_only: true
    max_per_iteration: 1
  remove_area:
    description: Remove an area (corridor/room) and its doors/cover/stairs; the space becomes solid
    params: [target]
    before_gate_b_only: true
    requires_annotation: true        # only when a human annotation asks for it
  lighting:
    description: Light intensity, colour or position
    params: [target]
    from_phase: 7
