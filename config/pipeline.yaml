# Pipeline configuration. All paths are relative to the repo root.
# Machine-specific overrides go in config/pipeline.local.yaml (gitignored, deep-merged).

paths:
  tools_dir: tools
  build_dir: build
  maps_dir: maps
  runs_dir: runs
  history_dir: history     # one version per changed .bsp (renders, data, review)
  wad_dirs:
    - assets/wads

compiler:
  # SDHLT is the maintained fork of Vluzacn's ZHLT v34 (VHLT). Flags verified
  # against `-help` output of v1.3.0 (2026-10-10).
  flavor: sdhlt
  version: 1.3.0
  url: https://github.com/seedee/SDHLT/releases/download/v1.3.0/sdhlt_v130.zip
  sha256: 393bcd59ac840c50d12521ea56370885592bafdb1bcde8d7a011c3182cc12f48
  archive_root: sdhlt-v1.3.0/tools
  platforms:
    windows:
      bin_dir: Win64
      csg: sdHLCSG_x64.exe
      bsp: sdHLBSP_x64.exe
      vis: sdHLVIS_x64.exe
      rad: sdHLRAD_x64.exe
      flags: ["-console", "0"]  # no pop-up console window
    linux:
      bin_dir: Linux
      csg: sdHLCSG
      bsp: sdHLBSP
      vis: sdHLVIS
      rad: sdHLRAD
      flags: []

# Flags per compile step. Shared defaults (-low priority) come from SDHLT's settings.txt.
profiles:
  fast:
    csg: []
    bsp: []
    vis: ["-fast"]
    rad: []
  final:
    csg: []
    bsp: []
    vis: ["-full"]
    rad: ["-extra", "-bounce", "8"]

wad:
  # WADs whose textures are embedded into the .bsp (hlcsg -wadinclude), so the
  # client needs no external WAD.
  include:
    - mapforge_dev.wad

validate:
  grid: 8                 # every brush vertex must lie on this grid (CLAUDE.md: 16/8-grid)
  world_bounds: 4096      # |coordinate| limit for brush vertices
  limit_error_pct: 90     # FITNESS.md hard requirement: no engine limit above 90 %
  limit_warn_pct: 75
  # Engine limits. Started from HLSDK utils/common/bspfile.h (MAX_MAP_*), then corrected
  # where shipped official maps prove the engine accepts more (phase 1b calibration):
  #   texinfo 8192 -> 32767 (dface_t.texinfo is a short; de_torn has 11067)
  #   models 400 -> 512 (engine MAX_MODELS; HLSDK's 400 is the old compile-tool cap)
  #   lighting 2 MB -> compiler cap (de_chateau has 2.29 MB); real cap is AllocBlock (below)
  # > 100 % = exceeds the engine (always an error); > limit_error_pct = FITNESS headroom
  # policy (error for our maps, warning for reference maps).
  engine_limits:
    models: 512
    planes: 32767
    vertexes: 65535
    nodes: 32767
    texinfo: 32767
    faces: 65535
    clipnodes: 32767
    visleafs: 8192
    marksurfaces: 65535
    edges: 256000
    surfedges: 512000
    textures: 512
    entities: 1024
    entdata_bytes: 131072
    lighting_bytes: 50331648   # SDHLT -lightdata default
    visibility_bytes: 8388608  # SDHLT visdata cap
  # Rows of the compiler's own limit table that have no BSP-count equivalent above.
  compiler_table_rows: [AllocBlock]
  # Entity rules (FITNESS.md). Per-map overrides: maps/<map>/validate.yaml (key `rules`).
  rules:
    spawns_per_team: 10
    buyzones_per_team: 1
    bomb_targets: {de: 2}   # by map type = name prefix before "_" (de_dust -> de)
  # Walkable graph: flood-fill from the spawns with a standing player hull (hull 1).
  walk:
    cell: 8               # horizontal grid (units)
    z_step: 4             # vertical grid (units)
    max_step: 18          # max step up between neighbouring cells (GoldSrc stepsize)
    max_drop: 1024        # longest fall still counted as a (one-way) move
    jump_height: 54       # duck-jump onto objects (0 = no jumping)
    crouch: true          # crouch-only passages (vents) count as walkable
  # Spawn -> site timings at 250 u/s (docs/DESIGN_GUIDE.md §2, calibrated on 9 official maps:
  # T 14-25 s, CT lead typically 7-13 s). Warnings on our maps, info on reference maps.
  timings:
    min_t_s: 14          # T faster than this: map too compact for chokepoints/rotations
    max_t_s: 26          # slower: long, empty rounds
    min_ct_lead_s: 3     # defenders must reach the site a few seconds before attackers
  # Checked only on reachable cells of the walkable graph.
  corridors:
    min_width: 64         # CLAUDE.md: corridors/doors min. 64 wide
    min_height: 96        # CLAUDE.md: 96-128 high (rule of thumb)
    min_cluster_cells: 4  # ignore narrow/low spots smaller than this (cells of 8x8)
    max_reported: 20      # findings per rule; totals are in stats

reference_maps:
  # Third-party maps used only to test/calibrate the pipeline; never committed.
  archives_dir: test_maps      # *.rar / *.zip dropped here are unpacked by `./mf refmaps`
  extract_dir: build/refmaps   # one sub-dir per archive
  # Searched recursively (in order) for <map>.bsp. Absolute paths are used as-is; missing
  # dirs are skipped. /refmaps/hl is the read-only Half-Life install mounted by compose.yaml.
  dirs:
    - build/refmaps
    - /refmaps/hl/cstrike/maps

render:
  camera_size: [1280, 720]
  # Dark zones: walkable floor whose compiled lightmap luma (0-255) is below dark_luma, in
  # clusters of >= min_zone_cells walk cells (16x16 units). Calibrated on official maps
  # (docs/CALIBRATION.md): 0-6 such zones per map there; FITNESS wants 0 for our maps (phase 7).
  brightness:
    dark_luma: 10
    min_zone_cells: 16
  # WADs for textures not embedded in the .bsp. The map's own mod dir (<bsp>/../*.wad) is
  # always searched first; then these (missing dirs are skipped).
  wad_dirs:
    - assets/wads
    - /refmaps/hl/cstrike
    - /refmaps/hl/valve

review:
  # session: the Claude Code session (or a subagent) answers the emitted prompt (default);
  # headless: `claude -p` on the host (unattended runs). Same prompt, schema, pass rule.
  executor: session
  # headless only: null = Claude Code's default model.
  model: null
  timeout_s: 600
  # login: use the claude.ai login (an ANTHROPIC_API_KEY in the environment is ignored for
  # this call); api_key: use ANTHROPIC_API_KEY as is.
  auth: login

decide:
  # Roadmap phase the plan is checked for (lighting changes need >= 7).
  phase: 3

site:
  # Rebuild build/site/ at the end of validate / render / review / decide.
  auto_refresh: true
