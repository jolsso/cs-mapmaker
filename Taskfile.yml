version: '3'

# Official: `./mf <name>` (runs inside the forge container).
# Host fallback for debugging: `uv run task <name>`.

vars:
  PROFILE: '{{.PROFILE | default "fast"}}'

tasks:
  setup:
    desc: Sync Python env, fetch compilers, generate dev WAD
    cmds:
      - uv sync
      - task: tools:fetch
      - task: wad

  tools:fetch:
    desc: Download pinned map compilers into tools/
    cmds:
      - uv run python -m mapforge.tools.fetch

  wad:
    desc: Generate assets/wads/mapforge_dev.wad
    cmds:
      - uv run python -m mapforge.wad.dev_textures

  generate:
    desc: Generate maps/<map>/src/<map>.map from maps/<map>/layout.yaml (MAP=<name>)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.generator.run --map {{.MAP}}

  compile:
    desc: Compile a map (MAP=<name>, PROFILE=fast|final)
    requires:
      vars: [MAP]
    deps: [setup]
    cmds:
      - uv run python -m mapforge.compile.run --map {{.MAP}} --profile {{.PROFILE}}

  validate:
    desc: Compile + validate a map -> build/<map>/validation.json (MAP=<name>, PROFILE=fast|final)
    requires:
      vars: [MAP]
    deps: [setup]
    cmds:
      - uv run python -m mapforge.validate.run --map {{.MAP}} --profile {{.PROFILE}} --source {{.SOURCE | default "map"}}

  validate:refs:
    desc: Validate all reference maps with a prefix (PREFIX=de_) -> build/reference_report.json
    cmds:
      - uv run python -m mapforge.validate.reference_report --prefix {{.PREFIX | default "de_"}}

  refmaps:
    desc: Unpack test_maps/ archives and list reference maps (official + community)
    cmds:
      - uv run python -m mapforge.refmaps --list

  render:
    desc: Render a map -> build/<map>/renders/ (MAP=<name>, SOURCE=map|reference)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.render.run --map {{.MAP}} --source {{.SOURCE | default "map"}}

  review:
    desc: Review gate -> build/<map>/review.json (MAP=<name>; -- --emit|--answer|--headless)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.review.run --map {{.MAP}} {{.CLI_ARGS}}

  decide:
    desc: Decide step -> runs/<map>/<NNN>/ (MAP=<name>; -- --emit | --answer)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.decide.run --map {{.MAP}} {{.CLI_ARGS}}

  feedback:
    desc: In-game feedback server (MAP=<name>; -- --start | --collect | --stop) - notes become the map's wishes
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.feedback --map {{.MAP}} {{.CLI_ARGS}}

  style:
    desc: Style review (phase 7) - cameras over every area/door/landmark -> build/<map>/style/ + style_prompt.md (MAP=<name>; -- --answer scores the subagent's answer)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.style.run --map {{.MAP}} {{.CLI_ARGS}}

  textures:
    desc: Texture catalog over our own and the game's WADs -> build/textures/catalog.json (+ one contact sheet PNG per WAD with -- --sheets)
    cmds:
      - uv run python -m mapforge.wad.catalog {{.CLI_ARGS}}

  brief:
    desc: Interpreter (phase 8a) - brief + images -> build/<map>/intent_prompt.md + schema (MAP=<name>; -- --answer checks build/<map>/intent_answer.json -> maps/<map>/intent.json)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.interpret --map {{.MAP}} {{.CLI_ARGS}}

  repeats:
    desc: Repeat risk of the textures a map uses (config/texture_risk.json; MAP=<name>; -- --rate asks the local vision model for the unrated ones and the calm siblings of high-risk ones)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.wad.repeat --map {{.MAP}} {{.CLI_ARGS}}

  topology:
    desc: Topology of a map (rooms and connections, docs/MAPMAKER.md) -> build/<map>/topology.yaml (MAP=<name>)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.topology --map {{.MAP}} {{.CLI_ARGS}}

  sketch:
    desc: Strokes drawn on a map (path annotations) -> angled corridors + knee rooms as layout YAML (MAP=<name>, ID=<annotation>)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.sketch --map {{.MAP}} {{if .ID}}--id {{.ID}}{{end}} {{.CLI_ARGS}}

  history:
    desc: Snapshot the current build of a map into history/<map>/ (MAP=<name>, NOTE="...")
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.history --map {{.MAP}} {{if .NOTE}}--note "{{.NOTE}}"{{end}}

  site:
    desc: Rebuild the local website build/site/ (view with `docker compose up -d site` -> localhost:8080)
    cmds:
      - uv run python -m mapforge.site.build

  simulate:
    desc: HLDS + YaPB bots play the map -> build/<map>/simulation.json (MAP=<name>, SOURCE=map|reference; -- --smoke-only|--watch|--rounds N)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.simulate.run --map {{.MAP}} --source {{.SOURCE | default "map"}} {{.CLI_ARGS}}

  analyze:
    desc: Simulation CSV -> build/<map>/analysis/ (metrics.json, report.md, heatmaps) (MAP=<name>; -- --baseline FILE)
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.analyze.run --map {{.MAP}} {{.CLI_ARGS}}

  loop:
    desc: Autonomous loop (MAP=<name>; -- --init [--force-sim] | --status); exit 3 = awaiting a Review/Decide answer
    requires:
      vars: [MAP]
    cmds:
      - uv run python -m mapforge.loop.run --map {{.MAP}} {{.CLI_ARGS}}

  test:
    desc: Run pytest
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  lint:
    desc: Run ruff
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
